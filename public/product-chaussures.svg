<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eff2f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shoe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="200" fill="url(#bg)"/>
  
  <!-- Chaussure Nike améliorée -->
  <g transform="translate(150, 105)">
    <!-- Ombre -->
    <ellipse cx="0" cy="35" rx="50" ry="8" fill="#000000" opacity="0.12"/>
    
    <!-- Chaussure principale -->
    <g filter="url(#shadow)">
      <path d="M -45 15 Q -50 5 -45 -10 Q -35 -20 -15 -22 Q 0 -23 15 -22 Q 35 -20 45 -10 Q 50 5 45 15 L 42 28 Q 20 32 0 33 Q -20 32 -42 28 Z" 
            fill="url(#shoe-grad)"/>
    </g>
    
    <!-- Doublure intérieure -->
    <path d="M -35 12 Q -40 5 -35 -8 Q -20 -18 0 -20 Q 20 -18 35 -8 Q 40 5 35 12 L 33 24 Q 15 28 0 29 Q -15 28 -33 24 Z" 
          fill="#f5e6d3" opacity="0.7"/>
    
    <!-- Swoosh Nike -->
    <path d="M -15 0 Q 5 -15 30 5" 
          stroke="#ffd700" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Trou de ventilation -->
    <circle cx="-8" cy="5" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="8" cy="5" r="3" fill="#ffffff" opacity="0.5"/>
    
    <!-- Talon -->
    <rect x="-6" y="22" width="12" height="8" fill="#1a1a1a" rx="1" opacity="0.8"/>
    
    <!-- Reflet brillant -->
    <ellipse cx="-20" cy="-8" rx="12" ry="8" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
