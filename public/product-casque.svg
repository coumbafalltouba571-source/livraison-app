<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg)"/>
  
  <!-- Casque Bluetooth -->
  <g transform="translate(150, 90)">
    <!-- Arceau principal -->
    <path d="M -45 -20 Q -50 -35 0 -40 Q 50 -35 45 -20" fill="none" stroke="#2c3e50" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Coussinets -->
    <circle cx="-45" cy="5" r="12" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="45" cy="5" r="12" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Intérieur coussinets -->
    <circle cx="-45" cy="5" r="8" fill="#3498db" opacity="0.7"/>
    <circle cx="45" cy="5" r="8" fill="#3498db" opacity="0.7"/>
    
    <!-- Connecteur central -->
    <circle cx="0" cy="-38" r="6" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    
    <!-- Microphone boom -->
    <path d="M -35 15 Q -40 25 -38 35" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-38" cy="35" r="5" fill="#3498db"/>
    
    <!-- Symbole Bluetooth -->
    <path d="M 8 -35 L 5 -28 L 11 -28 M 8 -28 L 5 -21 L 11 -21" stroke="#27ae60" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
