<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eff2f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tshirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="200" fill="url(#bg)"/>
  
  <!-- T-shirt Premium amélioré -->
  <g transform="translate(150, 90)">
    <!-- Ombre -->
    <ellipse cx="0" cy="45" rx="45" ry="7" fill="#000000" opacity="0.12"/>
    
    <!-- Corps principal -->
    <g filter="url(#shadow2)">
      <path d="M -35 -28 L -48 -15 L -45 38 Q -20 48 0 48 Q 20 48 45 38 L 48 -15 L 35 -28 Z" 
            fill="url(#tshirt-grad)"/>
    </g>
    
    <!-- Manches gauche -->
    <path d="M -35 -22 L -55 -10 L -52 18 Q -48 20 -42 18 L -42 -18 Z" 
          fill="url(#tshirt-grad)" opacity="0.9"/>
    
    <!-- Manches droite -->
    <path d="M 35 -22 L 55 -10 L 52 18 Q 48 20 42 18 L 42 -18 Z" 
          fill="url(#tshirt-grad)" opacity="0.9"/>
    
    <!-- Encolure -->
    <circle cx="0" cy="-28" r="12" fill="#ffffff" opacity="0.15" stroke="#1e40af" stroke-width="1"/>
    
    <!-- Badge/Logo -->
    <circle cx="0" cy="8" r="18" fill="#fbbf24" opacity="0.9"/>
    <text x="0" y="14" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold" font-family="Arial">PREMIUM</text>
    
    <!-- Détails de couture -->
    <line x1="-1" y1="-15" x2="-1" y2="35" stroke="#1e40af" stroke-width="0.5" opacity="0.4"/>
    <line x1="1" y1="-15" x2="1" y2="35" stroke="#1e40af" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Reflet brillant -->
    <ellipse cx="-20" cy="-15" rx="15" ry="10" fill="#ffffff" opacity="0.2"/>
  </g>
</svg>
