<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg)"/>
  
  <!-- T-shirt Premium -->
  <g transform="translate(150, 80)">
    <!-- Corps principal -->
    <path d="M -35 -30 L -50 -15 L -45 40 Q 0 50 45 40 L 50 -15 L 35 -30 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Manches -->
    <path d="M -35 -20 L -60 -10 L -55 15" fill="#c0392b" stroke="#a93226" stroke-width="2"/>
    <path d="M 35 -20 L 60 -10 L 55 15" fill="#c0392b" stroke="#a93226" stroke-width="2"/>
    
    <!-- Encolure -->
    <circle cx="0" cy="-30" r="15" fill="#ffffff" opacity="0.4" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Logo/Texte -->
    <text x="0" y="10" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">PREMIUM</text>
    
    <!-- Détails -->
    <line x1="-15" y1="25" x2="15" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
